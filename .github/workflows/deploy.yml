name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm exec turbo build --filter=@aetherui/core --filter=@aetherui/tokens

      - name: Build docs
        id: build-docs
        continue-on-error: true
        env:
          # Project pages live under /AetherUI/, so the docs site must be built with
          # that prefix or its /_astro assets 404 (see packages/docs/astro.config.mjs).
          DOCS_SITE: https://debug-diary-1.github.io
          DOCS_BASE: /AetherUI/docs/
        run: |
          cd packages/docs
          pnpm build

      - name: Upload docs artifact
        if: steps.build-docs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: packages/docs/dist
          retention-days: 1

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm exec turbo build --filter=@aetherui/core --filter=@aetherui/tokens

      - name: Build Storybook
        id: build-storybook
        continue-on-error: true
        run: |
          cd packages/storybook
          pnpm build-storybook

      - name: Upload Storybook artifact
        if: steps.build-storybook.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-dist
          path: packages/storybook/storybook-static
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-docs, build-storybook]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create output directory
        run: |
          mkdir -p .output/docs
          mkdir -p .output/storybook
          cp -r .github/pages/* .output/

      - name: Download docs artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: .output/docs

      - name: Download Storybook artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: storybook-dist
          path: .output/storybook

      - name: Create fallback pages if needed
        run: |
          # Check if docs exist
          if [ ! -f .output/docs/index.html ]; then
            cp .github/pages/docs-fallback.html .output/docs/index.html
          fi

          # Check if storybook exists
          if [ ! -f .output/storybook/index.html ]; then
            cp .github/pages/storybook-fallback.html .output/storybook/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
