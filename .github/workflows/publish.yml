name: Publish to NPM

# Least privilege by default; the publish job opts into id-token below.
permissions:
  contents: read

on:
  push:
    tags: ['v*']

jobs:
  checks:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run full release checks
        run: pnpm check:release
        timeout-minutes: 45

  publish:
    needs: checks
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # No dependency caches in this job: it holds npm publish rights via OIDC,
      # so a restored pnpm store or turbo cache would be attacker-controlled
      # input if it were ever poisoned. This job builds from a clean state;
      # ci.yml keeps its caches (those jobs publish nothing).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild the tagged source using only the committed dependency lockfile.
      # Consumer checks run in the separate job without OIDC; no artifacts or
      # caches from that job enter this privileged process.
      - name: Build packages
        run: pnpm build

      # Publishing authenticates with npm Trusted Publishing (OIDC); there is no
      # long-lived npm token in this repository. `pnpm publish` packs the package
      # (rewriting `workspace:*` deps to real versions) and shells out to the
      # system `npm publish`, which exchanges this job's GitHub OIDC token
      # (`id-token: write` above) for a short-lived npm token. Configure each
      # @aetherui-kit/* package on npmjs.com with this exact publisher:
      # GitHub Actions, owner debug-diary-1, repo AetherUI, workflow publish.yml.
      # `registry-url` above writes a placeholder `_authToken` into .npmrc;
      # npm >= 11.5.1 overrides it once the OIDC exchange succeeds.
      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          v="$(npm --version)"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is older than 11.5.1; trusted publishing (OIDC) needs 11.5.1+`);
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} supports trusted publishing`);
          ' "$v"

      # tokens first (no workspace deps), then core, then the packages that
      # depend on core.
      - name: Publish packages
        run: |
          for pkg in tokens core accordion datatable agent mcp; do
            echo "::group::publish @aetherui-kit/$pkg"
            (cd "packages/$pkg" && pnpm publish --access public --no-git-checks --provenance)
            echo "::endgroup::"
          done
