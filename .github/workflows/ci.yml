name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CACHE_VERSION: v2  # Increment this to bust the cache

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0
          run_install: false
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
        env:
          cache-name: cache-node-modules-${{ env.CACHE_VERSION }}
      
      - name: Install dependencies
        run: pnpm install
      
      # Nx Cloud configuration - Enable when NX_CLOUD_ACCESS_TOKEN is set
      - name: Configure Nx Cloud
        run: |
          if [ -n "${{ secrets.NX_CLOUD_ACCESS_TOKEN }}" ]; then
            echo "NX_CLOUD_ACCESS_TOKEN=${{ secrets.NX_CLOUD_ACCESS_TOKEN }}" >> $GITHUB_ENV
          fi
        
      # Cache Nx
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      
      # Optional: Start Nx Cloud agents for distributed execution
      - name: Start Nx Cloud CI Run (if token available)
        if: env.NX_CLOUD_ACCESS_TOKEN != ''
        run: npx nx-cloud start-ci-run --stop-agents-after="build" --agent-count=3
        
      - name: Run affected lint
        run: npx nx affected --target=lint --parallel=3 --base=origin/main --exclude=aetherui
        timeout-minutes: 5
        
      - name: Run affected tests
        run: NODE_OPTIONS='--max-old-space-size=2048' npx nx affected --target=test --parallel=3 --ci --base=origin/main --exclude=aetherui
        timeout-minutes: 15
        
      - name: Run affected build
        run: NODE_OPTIONS='--max-old-space-size=4096' npx nx affected --target=build --parallel=3 --base=origin/main --exclude=aetherui
        timeout-minutes: 15
      
      # Stop Nx Cloud agents
      - name: Stop Nx Cloud agents
        if: always() && env.NX_CLOUD_ACCESS_TOKEN != ''
        run: npx nx-cloud stop-all-agents