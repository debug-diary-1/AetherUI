name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          
      - name: Install PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0
          run_install: false
      
      - name: Install dependencies
        run: pnpm install
      
      # Remove Nx Cloud commands for now since it's not configured
      # If you want to use Nx Cloud, add NX_CLOUD_ACCESS_TOKEN to your GitHub secrets
      
      - name: Run affected lint
        run: npx nx affected --target=lint --parallel=3 --base=origin/main
        
      - name: Run affected tests
        run: npx nx affected --target=test --parallel=3 --ci --base=origin/main
        
      - name: Run affected build
        run: npx nx affected --target=build --parallel=3 --base=origin/main