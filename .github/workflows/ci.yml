name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0
          run_install: false
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      # Nx Cloud configuration
      - name: Start Nx Cloud CI Run
        run: npx nx-cloud start-ci-run --stop-agents-after="build" --agent-count=2
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        continue-on-error: true
      
      - name: Run affected lint
        run: |
          npx nx affected --target=lint --parallel=2 --base=origin/main --exclude=aetherui || true
          echo "Lint completed"
        timeout-minutes: 5
        
      - name: Run affected tests
        run: NODE_OPTIONS='--max-old-space-size=2048' npx nx affected --target=test --parallel=2 --ci --base=origin/main --exclude=aetherui || true
        timeout-minutes: 15
        
      - name: Run affected build
        run: NODE_OPTIONS='--max-old-space-size=4096' npx nx affected --target=build --parallel=2 --base=origin/main --exclude=aetherui || true
        timeout-minutes: 15