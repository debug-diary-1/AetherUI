name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.18.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
          
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
        
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run lint
        run: pnpm lint
        timeout-minutes: 5

      - name: Validate theme integration (no hardcoded colors)
        run: |
          echo "Checking for hardcoded colors in component styles..."
          FOUND_ISSUES=false

          # Check for hardcoded hex colors in styles.ts files
          if grep -rn --include="styles.ts" "#[0-9a-fA-F]\{3,6\}" packages/core/src/ | grep -v "@cssproperty\|//.*#\|/\*.*#"; then
            echo ""
            echo "ERROR: Hardcoded hex colors found in component styles!"
            echo "Please use CSS variables from the theme system instead."
            FOUND_ISSUES=true
          fi

          if [ "$FOUND_ISSUES" = true ]; then
            echo ""
            echo "See packages/tokens/src/light.css and dark.css for available variables."
            exit 1
          fi

          echo "Theme validation passed - no hardcoded colors found!"
        timeout-minutes: 2

      - name: Run tests
        run: NODE_OPTIONS='--max-old-space-size=2048' pnpm test
        timeout-minutes: 15

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/coverage-final.json
          flags: unittests
          name: codecov-aetherui
          fail_ci_if_error: false

      - name: Run build
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm build
        timeout-minutes: 15

      - name: Build Storybook
        run: pnpm build-storybook
        timeout-minutes: 10

      - name: Run Storybook Tests
        run: pnpm test:storybook:ci
        timeout-minutes: 10

      - name: Run E2E Visual Tests
        run: pnpm test:e2e --update-snapshots
        env:
          CI: true
          STORYBOOK_URL: http://localhost:6006
        timeout-minutes: 10
        continue-on-error: true
        id: e2e-tests

      - name: Check for missing Linux baselines
        id: check-baselines
        run: |
          if git status --porcelain | grep -q "__snapshots__.*linux"; then
            echo "missing_baselines=true" >> $GITHUB_OUTPUT
            echo "⚠️ Linux baselines were generated. Please commit them:"
            git status --porcelain | grep "__snapshots__"
          else
            echo "missing_baselines=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload generated Linux baselines
        uses: actions/upload-artifact@v4
        if: steps.check-baselines.outputs.missing_baselines == 'true'
        with:
          name: linux-baselines
          path: tests/e2e/__snapshots__/
          retention-days: 7

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        if: steps.e2e-tests.outcome == 'failure'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload E2E Screenshots
        uses: actions/upload-artifact@v4
        if: steps.e2e-tests.outcome == 'failure'
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

      - name: Fail if E2E tests failed (and not just missing baselines)
        if: steps.e2e-tests.outcome == 'failure' && steps.check-baselines.outputs.missing_baselines != 'true'
        run: exit 1