name: CI

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run lint
        run: pnpm lint
        timeout-minutes: 5

      - name: Run typecheck
        run: pnpm typecheck
        timeout-minutes: 5

      - name: Validate theme integration (no hardcoded colors)
        run: |
          echo "Checking for hardcoded colors in component styles..."
          FOUND_ISSUES=false

          # Check for hardcoded hex colors in styles.ts files
          if grep -rn --include="styles.ts" "#[0-9a-fA-F]\{3,6\}" packages/core/src/ | grep -v "@cssproperty\|//.*#\|/\*.*#"; then
            echo ""
            echo "ERROR: Hardcoded hex colors found in component styles!"
            echo "Please use CSS variables from the theme system instead."
            FOUND_ISSUES=true
          fi

          if [ "$FOUND_ISSUES" = true ]; then
            echo ""
            echo "See packages/tokens/src/light.css and dark.css for available variables."
            exit 1
          fi

          echo "Theme validation passed - no hardcoded colors found!"
        timeout-minutes: 2

      - name: Verify generated agent artifacts
        run: pnpm check:agent-artifacts

      - name: Run release contract tests
        run: pnpm test:release-contracts

      - name: Run tests
        run: NODE_OPTIONS='--max-old-space-size=2048' pnpm test
        timeout-minutes: 15

      - name: Enforce core coverage thresholds
        run: pnpm test:coverage
        timeout-minutes: 10

      - name: Run core tests across browser engines
        run: pnpm test:cross-browser
        timeout-minutes: 15

      # Codecov rejects tokenless uploads. CODECOV_TOKEN has never been set in
      # this repository, so every upload failed with "Token required - not valid
      # tokenless upload" while fail_ci_if_error: false swallowed it and the step
      # still reported success. CI has been claiming coverage uploads that never
      # happened. Gate on the token the same way Chromatic does, and fail loudly
      # when a token IS present so a real upload failure cannot go unnoticed.
      - name: Check Codecov token
        id: codecov-token
        if: always()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN not available - skipping coverage upload."
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: always() && steps.codecov-token.outputs.available == 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/core/coverage/lcov.info
          flags: unittests
          name: codecov-aetherui
          fail_ci_if_error: true

      - name: Run build
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm build
        timeout-minutes: 15

      - name: Typecheck generated React declarations
        run: pnpm typecheck:react

      - name: Run agent UI evals
        run: pnpm test:agent-evals

      - name: Verify publishable package contents
        run: pnpm pack:check

      - name: Test packed package consumers
        run: pnpm test:consumers
        timeout-minutes: 10

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Build Storybook
        run: pnpm build-storybook
        timeout-minutes: 10

      - name: Run Storybook Tests
        run: pnpm test:storybook:ci
        timeout-minutes: 10

      - name: Run end-to-end component flows
        run: pnpm test:e2e:static
        timeout-minutes: 10

      # Secrets are not available to Dependabot-triggered runs or to pull requests
      # from forks, so only run Chromatic when the token is actually present.
      - name: Check Chromatic token
        id: chromatic-token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CHROMATIC_PROJECT_TOKEN not available (Dependabot or fork PR) - skipping Chromatic."
          fi

      - name: Run Chromatic Visual Tests
        if: steps.chromatic-token.outputs.available == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: pnpm chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
