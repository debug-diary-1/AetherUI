name: Deploy GitHub Pages Site

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment for this workflow
concurrency:
  group: "pages-simple"
  cancel-in-progress: true

jobs:
  # First try to build Astro docs
  build-docs:
    name: Build Astro Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0
          run_install: false
          
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      # Build Core Packages First
      - name: Build dependencies
        run: |
          echo "Building core and tokens packages..."
          pnpm turbo run build --filter="@aetherui/core" --filter="@aetherui/tokens" --no-daemon

      # Build Astro docs with error handling
      - name: Build Astro docs
        id: build-docs
        continue-on-error: true
        run: |
          cd packages/docs
          pnpm build
          echo "DOCS_BUILD_SUCCESS=true" >> $GITHUB_ENV

      # Upload the docs build if successful
      - name: Upload Astro docs
        if: steps.build-docs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: astro-docs
          path: packages/docs/dist
          retention-days: 1

  # Build Storybook
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0
          run_install: false
          
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      # Build Core Packages First
      - name: Build dependencies
        run: |
          echo "Building core and tokens packages..."
          pnpm turbo run build --filter="@aetherui/core" --filter="@aetherui/tokens" --no-daemon

      # Build Storybook with error handling
      - name: Build Storybook
        id: build-storybook
        continue-on-error: true
        run: |
          cd packages/storybook
          pnpm build-storybook
          echo "STORYBOOK_BUILD_SUCCESS=true" >> $GITHUB_ENV
          
      # Upload the Storybook build if successful
      - name: Upload Storybook
        if: steps.build-storybook.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-build
          path: packages/storybook/storybook-static
          retention-days: 1

  # Deploy to GitHub Pages
  deploy-pages:
    name: Deploy GitHub Pages Site
    needs: [build-docs, build-storybook]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://pallavl01.github.io/AetherUI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Create basic directory structure
      - name: Create site structure
        run: |
          mkdir -p .output
          mkdir -p .output/docs
          mkdir -p .output/storybook
      
      # Create landing page
      - name: Create landing page
        run: |
          cat > .output/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AetherUI</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                line-height: 1.6;
                text-align: center;
              }
              .container {
                margin-top: 60px;
              }
              h1 {
                font-size: 2.5rem;
                margin-bottom: 1rem;
                color: #3a86ff;
              }
              .links {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 40px;
              }
              .link {
                display: inline-block;
                background: #3a86ff;
                color: white;
                padding: 15px 30px;
                border-radius: 4px;
                text-decoration: none;
                font-weight: bold;
                transition: background 0.2s;
              }
              .link:hover {
                background: #2563eb;
              }
              .features {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                margin-top: 50px;
              }
              .feature {
                background: #f8f9fa;
                border: 1px solid #e9ecef;
                border-radius: 8px;
                padding: 20px;
                width: 200px;
                text-align: center;
              }
              .feature-icon {
                font-size: 2rem;
                margin-bottom: 10px;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>AetherUI</h1>
              <p>A headless, framework-agnostic Web Component library built on Lit</p>
              <div class="links">
                <a href="./docs/" class="link">Documentation</a>
                <a href="./storybook/" class="link">Storybook</a>
              </div>
              
              <div class="features">
                <div class="feature">
                  <div class="feature-icon">🚀</div>
                  <h3>Framework-agnostic</h3>
                  <p>Use with any framework or vanilla JS</p>
                </div>
                <div class="feature">
                  <div class="feature-icon">🎨</div>
                  <h3>Themeable</h3>
                  <p>Design token-driven styling</p>
                </div>
                <div class="feature">
                  <div class="feature-icon">♿️</div>
                  <h3>Accessible</h3>
                  <p>Built-in a11y support</p>
                </div>
              </div>
            </div>
          </body>
          </html>
          EOF
      
      # Try to download the Astro docs artifact
      - name: Download Astro docs artifact
        id: download-docs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: astro-docs
          path: .output/docs
      
      # Create fallback docs page if Astro artifact not found
      - name: Create fallback docs page if needed
        if: steps.download-docs.outcome != 'success'
        run: |
          echo "Astro docs artifact not found, creating fallback..."
          cat > .output/docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AetherUI Documentation</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                line-height: 1.6;
              }
              h1 {
                color: #3a86ff;
              }
              .notice {
                background: #f8f9fa;
                border-left: 4px solid #3a86ff;
                padding: 20px;
                margin: 20px 0;
                border-radius: 4px;
              }
              .back-link {
                display: inline-block;
                margin-top: 20px;
                color: #3a86ff;
                text-decoration: none;
              }
              .back-link:hover {
                text-decoration: underline;
              }
              .components {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
                margin-top: 30px;
              }
              .component-card {
                background: #f8f9fa;
                border: 1px solid #e9ecef;
                border-radius: 8px;
                padding: 15px;
              }
              .component-card h3 {
                margin-top: 0;
                color: #3a86ff;
              }
            </style>
          </head>
          <body>
            <h1>AetherUI Documentation</h1>
            <div class="notice">
              <p><strong>Notice:</strong> The Astro documentation site is currently being updated.</p>
              <p>Below is a temporary overview of the component library.</p>
            </div>
            
            <h2>Component Overview</h2>
            <div class="components">
              <div class="component-card">
                <h3>Button</h3>
                <p>Interactive button component with multiple variants.</p>
              </div>
              <div class="component-card">
                <h3>Checkbox</h3>
                <p>Selectable input control for multiple choices.</p>
              </div>
              <div class="component-card">
                <h3>Dropdown</h3>
                <p>Expandable menu for options selection.</p>
              </div>
              <div class="component-card">
                <h3>Modal</h3>
                <p>Overlay dialog for focused interactions.</p>
              </div>
              <div class="component-card">
                <h3>Tabs</h3>
                <p>Content organization with tabbed navigation.</p>
              </div>
              <div class="component-card">
                <h3>DataTable</h3>
                <p>Advanced data grid with sorting and filtering.</p>
              </div>
            </div>
            
            <a href="../" class="back-link">← Back to AetherUI Home</a>
          </body>
          </html>
          EOF
      
      # Try to download the Storybook artifact
      - name: Download Storybook artifact
        id: download-storybook
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: storybook-build
          path: .output/storybook
      
      # Create fallback Storybook page if artifact not found
      - name: Create fallback Storybook page if needed
        if: steps.download-storybook.outcome != 'success'
        run: |
          echo "Storybook artifact not found, creating fallback..."
          cat > .output/storybook/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AetherUI Storybook</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                line-height: 1.6;
              }
              h1 {
                color: #3a86ff;
              }
              .notice {
                background: #f8f9fa;
                border-left: 4px solid #3a86ff;
                padding: 20px;
                margin: 20px 0;
                border-radius: 4px;
              }
              .back-link {
                display: inline-block;
                margin-top: 20px;
                color: #3a86ff;
                text-decoration: none;
              }
              .back-link:hover {
                text-decoration: underline;
              }
              .preview {
                margin-top: 30px;
                border: 1px solid #e9ecef;
                border-radius: 8px;
                overflow: hidden;
              }
              .preview-header {
                background: #f8f9fa;
                padding: 10px 15px;
                border-bottom: 1px solid #e9ecef;
              }
              .preview-content {
                padding: 30px;
                display: flex;
                gap: 15px;
                flex-wrap: wrap;
              }
              .preview-button {
                display: inline-block;
                padding: 10px 20px;
                background: #3a86ff;
                color: white;
                border: none;
                border-radius: 4px;
                font-family: inherit;
                font-size: 14px;
                cursor: pointer;
              }
              .preview-button.secondary {
                background: #6c757d;
              }
              .preview-button.outline {
                background: transparent;
                border: 1px solid #3a86ff;
                color: #3a86ff;
              }
              .preview-checkbox {
                display: flex;
                align-items: center;
                gap: 8px;
              }
            </style>
          </head>
          <body>
            <h1>AetherUI Storybook</h1>
            <div class="notice">
              <p><strong>Notice:</strong> The Storybook site is currently being updated.</p>
              <p>Below are some preview examples of the component library.</p>
            </div>
            
            <h2>Component Preview</h2>
            <div class="preview">
              <div class="preview-header">Button Component</div>
              <div class="preview-content">
                <button class="preview-button">Primary</button>
                <button class="preview-button secondary">Secondary</button>
                <button class="preview-button outline">Outline</button>
              </div>
            </div>
            
            <div class="preview" style="margin-top: 20px;">
              <div class="preview-header">Checkbox Component</div>
              <div class="preview-content">
                <label class="preview-checkbox">
                  <input type="checkbox" checked> Option 1
                </label>
                <label class="preview-checkbox">
                  <input type="checkbox"> Option 2
                </label>
                <label class="preview-checkbox">
                  <input type="checkbox"> Option 3
                </label>
              </div>
            </div>
            
            <a href="../" class="back-link">← Back to AetherUI Home</a>
          </body>
          </html>
          EOF
      
      # Check what we've got
      - name: Debug directory structure
        run: |
          echo "Final output structure:"
          find .output -type f | sort
      
      # Upload and deploy
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4