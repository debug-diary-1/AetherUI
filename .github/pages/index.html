<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherUI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      text-align: center;
    }
    .container {
      margin-top: 60px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #3a86ff;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }
    .link {
      display: inline-block;
      background: #3a86ff;
      color: white;
      padding: 15px 30px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .link:hover {
      background: #2563eb;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 50px;
    }
    .feature {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 20px;
      width: 200px;
      text-align: center;
    }
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AetherUI</h1>
    <p>A headless, framework-agnostic Web Component library built on Lit</p>
    <div class="links">
      <a href="./docs/" class="link">Documentation</a>
      <a href="./storybook/" class="link">Storybook</a>
    </div>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🚀</div>
        <h3>Framework-agnostic</h3>
        <p>Use with any framework or vanilla JS</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🎨</div>
        <h3>Themeable</h3>
        <p>Design token-driven styling</p>
      </div>
      <div class="feature">
        <div class="feature-icon">♿️</div>
        <h3>Accessible</h3>
        <p>Built-in a11y support</p>
      </div>
    </div>
  </div>
</body>
</html>
