<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeCombo Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", 
                   Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", 
                   "Helvetica Neue", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .example {
      margin-bottom: 2rem;
      max-width: 300px;
    }
    
    h3 {
      margin-bottom: 0.5rem;
    }
    
    ae-combo {
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>AeCombo Test</h1>
  
  <div class="example">
    <h3>Basic Combobox</h3>
    <ae-combo id="basic-combo" placeholder="Select a fruit..."></ae-combo>
  </div>
  
  <div class="example">
    <h3>With Preselected Value</h3>
    <ae-combo id="preselected-combo" placeholder="Select a color..." value="Blue"></ae-combo>
  </div>
  
  <div class="example">
    <h3>Disabled Combobox</h3>
    <ae-combo id="disabled-combo" placeholder="You cannot select me" disabled></ae-combo>
  </div>
  
  <script type="module">
    // Import directly for testing purposes
    import { defineAeCombo } from './src/combo/ae-combo.js';
    
    // Define the component
    defineAeCombo();
    
    window.addEventListener('DOMContentLoaded', () => {
      console.log('DOM content loaded, initializing combos...');
      
      // Basic combo
      const basicCombo = document.getElementById('basic-combo');
      basicCombo.items = [
        'Apple',
        'Banana',
        'Cherry',
        'Dragonfruit',
        'Elderberry',
        'Fig',
        'Grape',
        'Honeydew'
      ];
      
      basicCombo.addEventListener('ae-select', (e) => {
        console.log('Selected fruit:', e.detail.value);
      });
      
      // Preselected combo
      const preselectedCombo = document.getElementById('preselected-combo');
      preselectedCombo.items = [
        { id: 'red', label: 'Red' },
        { id: 'blue', label: 'Blue' },
        { id: 'green', label: 'Green' },
        { id: 'yellow', label: 'Yellow' },
        { id: 'purple', label: 'Purple' },
        { id: 'orange', label: 'Orange' },
        { id: 'black', label: 'Black', disabled: true }
      ];
      
      preselectedCombo.addEventListener('ae-select', (e) => {
        console.log('Selected color:', e.detail.item);
      });
    });
  </script>
</body>
</html>
