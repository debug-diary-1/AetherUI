<svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing circle (representing aether) -->
  <circle cx="50" cy="50" r="40" fill="url(#aether-gradient)" />
  
  <!-- Orbital rings representing UI components -->
  <circle cx="50" cy="50" r="30" stroke="white" stroke-width="1.5" stroke-opacity="0.6" fill="none" />
  <ellipse cx="50" cy="50" rx="45" ry="25" stroke="white" stroke-width="1.5" stroke-opacity="0.4" fill="none" transform="rotate(30 50 50)" />
  <ellipse cx="50" cy="50" rx="45" ry="20" stroke="white" stroke-width="1.5" stroke-opacity="0.3" fill="none" transform="rotate(-30 50 50)" />
  
  <!-- Central symbol -->
  <path d="M42 35L50 60L58 35M42 65H58" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="aether-gradient" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4D88FF" />
      <stop offset="100%" stop-color="#0033CC" />
    </linearGradient>
  </defs>
</svg> 