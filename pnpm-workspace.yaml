packages:
  - packages/*
  - packages/docs
  - packages/tokens
engineStrict: true
# Keep the release-age gate; exact reviewed upgrades are exempted below.
minimumReleaseAge: 1440
autoInstallPeers: true
strictPeerDependencies: false
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  '@parcel/watcher': false
  rs-module-lexer: false
  unrs-resolver: false
catalog:
  '@custom-elements-manifest/analyzer': 0.11.0
  '@astrojs/starlight': 0.42.0
  '@lit/reactive-element': 2.1.2
  '@open-wc/testing': 5.0.0
  '@playwright/test': 1.63.0
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/addon-links': 10.6.0
  '@storybook/test-runner': 0.24.5
  '@storybook/web-components-vite': 10.6.0
  '@types/node': 24.13.3
  '@types/prismjs': 1.26.6
  '@web/dev-server-esbuild': 2.0.0
  '@web/test-runner': 1.0.0
  '@web/test-runner-playwright': 1.0.0
  astro: 7.3.2
  chromatic: 18.7.2
  concurrently: 10.0.5
  eslint-plugin-storybook: 10.6.0
  http-server: 14.1.1
  husky: 9.1.7
  lit: 3.3.3
  lit-element: 4.2.2
  lit-html: 3.3.3
  oxfmt: 0.67.0
  oxlint: 1.85.0
  playwright: 1.63.0
  prismjs: 1.30.0
  rimraf: 6.1.3
  storybook: 10.6.0
  turbo: 2.10.12
  typescript: npm:@typescript/typescript6@6.0.2
  vite: 8.2.2
  unplugin-dts: 1.1.0
  '@typescript/native': npm:typescript@7.0.2

overrides:
  'minimatch@<3.1.4': 3.1.4
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.18.0
  'lodash@<4.18.1': 4.18.1
  'uuid@<11.1.1': 11.1.1
minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.1'
  - '@astrojs/mdx@8.0.1'
  - astro@7.3.2
  - electron-to-chromium@1.5.425
